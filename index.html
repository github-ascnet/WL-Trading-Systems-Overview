<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Systems Overview</title>
    <meta name="description" content="Landing page for all trading systems" />
    <link rel="stylesheet" href="css/landing.css" />
</head>

<body>
    <div id="pageLoader" class="page-loader-overlay" role="status" aria-live="polite" aria-label="Loading dashboard overview">
        <div class="page-loader-card">
            <div class="page-loader-spinner" aria-hidden="true"></div>
            <div class="page-loader-title">Loading dashboard...</div>
            <div class="page-loader-text" id="pageLoaderText">Please wait while the overview is being prepared.</div>
        </div>
    </div>

    <main class="landing">
        <!-- <header class="landing-header">
            <h1>Trading Systems Overview</h1>
        </header> -->

        <section class="portfolio-overview-section" aria-labelledby="portfolioOverviewTitle">
            <div class="portfolio-overview-card">
                <div class="portfolio-overview-header">
                    <div>
                        <h2 id="portfolioOverviewTitle" class="portfolio-overview-title">Wealth-Lab Meta-Portfolio</h2>
                    </div>
                    <div class="portfolio-overview-status" id="portfolioOverviewStatus">Loading...</div>
                </div>
                <div class="portfolio-overview-chart-wrap">
                    <svg id="portfolioOverviewChart" viewBox="0 0 1000 340" preserveAspectRatio="xMidYMid meet" aria-label="Aggregated portfolio equity chart"></svg>
                </div>
                <div class="portfolio-kpi-grid grid-cards" id="portfolioOverviewCards" aria-live="polite"></div>
            </div>
        </section>

        <section class="systems-grid" id="systemsGrid" aria-live="polite"></section>
    </main>

    <footer class="site-footer" aria-label="Footer">
        <div class="site-footer-inner footer-simple">
            <div class="site-footer-left">©2025 ASCNET Solutions GmbH</div>
            <div class="site-footer-right">Designed by GitHub Copilot</div>
        </div>
    </footer>

    <script src="js/systems.js"></script>
    <script src="js/kpi-config.js"></script>
    <script src="js/equity-overview-chart.js"></script>
    <script src="js/landing.js"></script>
</body>

</html>
